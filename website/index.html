<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bharat Realty Hub - Modal Enquiry</title>
<style>
body{font-family:Arial,sans-serif;margin:0;background:#f4f6f9}
header{background:#123d6b;color:#fff;text-align:center;padding:40px 20px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:20px;padding:20px;max-width:1300px;margin:auto}
.card{background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 2px 10px rgba(0,0,0,.12)}
.img{height:220px;background:#dbe7f5}
.img img{width:100%;height:100%;object-fit:cover;display:block}
.content{padding:15px}
.badge{padding:6px 10px;border-radius:20px;color:#fff;font-size:12px}
.sale{background:#2e7d32}.rent{background:#ef6c00}
.btn{width:100%;padding:12px;border:none;border-radius:8px;background:#123d6b;color:#fff;cursor:pointer}
</style>
</head>
<body>
<header><h1>Bharat Realty Hub</h1><p>Find your next home or farmhouse — to buy or rent</p></header>

<div class="grid" id="grid"><p style="padding:20px;text-align:center;grid-column:1/-1">Loading properties…</p></div>

<script>
const API_URL = 'https://site-velocity-6162.my.site.com/services/apexrest/properties';
let properties = [];

function renderProperties(){
 const grid = document.getElementById('grid');
 if (!properties.length) {
  grid.innerHTML = '<p style="padding:20px;text-align:center;grid-column:1/-1">No properties available right now.</p>';
  return;
 }
 grid.innerHTML = properties.map(p=>`
<div class="card">
<div class="img"><img src="${p.imageUrl}" alt="${p.name}" loading="lazy"></div>
<div class="content">
<span class="badge ${p.listingType==='Sale'?'sale':'rent'}">${p.listingType==='Sale'?'For Sale':'For Rent'}</span>
<h3>${p.name}</h3>
<p>₹${Number(p.price).toLocaleString('en-IN')}${p.listingType==='Rent'?' / month':''}</p>
<p>${p.bedrooms} BHK · ${p.bathrooms} Bath · ${p.areaSqft} sqft · ${p.city||''}</p>
<button class="btn" onclick="enquire('${p.id}')">Interested / Enquire</button>
</div>
</div>`).join('');
}

fetch(API_URL)
 .then(res => res.json())
 .then(data => {
  properties = data;
  renderProperties();
 })
 .catch(() => {
  document.getElementById('grid').innerHTML = '<p style="padding:20px;text-align:center;grid-column:1/-1">Could not load properties. Please try again later.</p>';
 });

function enquire(propertyId){
 const p=properties.find(x=>x.id===propertyId);
 const url=`https://site-velocity-6162.my.site.com/?propertyId=${p.id}&propertyName=${encodeURIComponent(p.name)}&listingType=${p.listingType}`;
 window.open(url, '_blank');
}
</script>
</body>
</html>
